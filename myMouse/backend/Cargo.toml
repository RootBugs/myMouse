[package]
name = "mymouse-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
mymouse-protocol = { path = "../shared/protocol" }
mdns-sd = "0.14"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = "0.13"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
