[package]
name = "mymouse-android-bridge"
version = "0.1.0"
edition = "2021"
description = "FFI bridge for myMouse Android app (protocol, pairing, trust, discovery primitives)"

[lib]
crate-type = ["cdylib", "rlib"]
name = "mymouse_android_bridge"

[features]
default = []
# Enable when generating real UniFFI bindings with Android NDK present.
# uniffi = ["dep:uniffi"]

[dependencies]
mymouse-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"

# Optional UniFFI runtime; kept out of default build to avoid heavy deps in this scaffold.
# uniffi = { version = "0.28", optional = true }

[dev-dependencies]
tempfile = "3"
